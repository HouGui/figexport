name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.release.prerelease == false
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish tested distributions
    if: github.event.repository.private == false
    needs: validate
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/figexport/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        # OIDC authenticates this workflow; no long-lived PyPI token is needed.
