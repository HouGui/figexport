[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "figexport"
version = "0.2.6"
description = "Export SVG, draw.io, LaTeX and PlantUML figures to PDF, SVG, PNG and JPG."
readme = "README.md"
authors = [{name = "Houssem Guissouma", email = "houssem.guissouma@gmx.de"}]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["figures", "svg", "drawio", "plantuml", "latex", "export"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "CairoSVG>=2.9.1",
    "Pillow>=12.3.0",
    "defusedxml>=0.7.1",
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://github.com/HouGui/figexport"
Documentation = "https://hougui.github.io/figexport/"
Issues = "https://github.com/HouGui/figexport/issues"
Releases = "https://github.com/HouGui/figexport/releases"

[project.optional-dependencies]
test = ["pytest>=9.2.0,<10", "pytest-cov>=7.1.0,<8"]
docs = ["mkdocs>=1.6.1,<2"]
dev = [
    "figexport[test,docs]",
    "ruff>=0.17.3,<0.18",
    "build>=1.6.1,<2",
    "twine>=7.0.0,<8",
]

[project.scripts]
figexport = "figexport.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = ["integration: requires native converters; opt in with FIGEXPORT_INTEGRATION=1"]

[tool.coverage.run]
source = ["figexport"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
